name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  runtime-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: environment/requirements-test.txt
      - name: Install CPU regression dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install torch==2.2.2 torchvision==0.17.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r environment/requirements-test.txt
          python -m pip install -e . --no-deps
      - name: Runtime, metric and migration regressions
        env:
          CUDA_VISIBLE_DEVICES: ''
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '1'
        run: python -m pytest -q --disable-warnings
      - name: Compile tracked Python only
        run: git ls-files -z '*.py' | xargs -0 -r -n1 python -m py_compile
      - name: Validate both shell script extensions
        run: git ls-files -z '*.sh' '*.bash' | xargs -0 -r -n1 bash -n
