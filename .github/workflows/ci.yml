name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  runtime-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -e .
      - name: Packet, CSV, temporal and failure-propagation regressions
        run: python -m unittest discover -s tests -v
      - name: Compile tracked Python only
        run: git ls-files -z '*.py' | xargs -0 -r -n1 python -m py_compile
      - name: Validate both shell script extensions
        run: git ls-files -z '*.sh' '*.bash' | xargs -0 -r -n1 bash -n
