[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-transmission"
version = "0.1.0"
description = "Reproducible LGVSC research tools"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
semtx = "semantic_transmission.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
